<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lanchonete Primavera — Peça pelo WhatsApp</title>
<meta name="description" content="Lanchonete Primavera, Centro de Arapongas-PR. Salgados assados e fritos, pastéis e lanches feitos na hora. Peça agora pelo WhatsApp.">
<meta name="theme-color" content="#7A1F1F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#7A1F1F;
    --maroon-deep:#511412;
    --red:#C5292E;
    --gold:#E8A93B;
    --gold-light:#F6CF7E;
    --cream:#FFF6E9;
    --cream-2:#FBEAD0;
    --choco:#3B2314;
    --ink:#241208;
    --whatsapp:#25D366;
    --shadow-color: 20 10 5;
    --radius: 22px;
    --serif: 'Fraunces', serif;
    --sans: 'Inter', sans-serif;
    --script: 'Caveat', cursive;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img,svg{display:block;max-width:100%;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:3px solid var(--gold);outline-offset:3px;}

  h1,h2,h3{font-family:var(--serif);margin:0;color:var(--maroon-deep);}
  .eyebrow{
    font-family:var(--script);
    font-size:1.4rem;
    color:var(--red);
    letter-spacing:.02em;
  }

  .wrap{max-width:1180px;margin:0 auto;padding-inline:24px;}

  /* ===== NAV ===== */
  .nav{
    position:sticky;top:0;z-index:50;
    background:rgba(255,246,233,.88);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(59,35,20,.08);
  }
  .nav-inner{
    max-width:1180px;margin:0 auto;padding:14px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .logo{
    display:flex;align-items:center;gap:10px;
    font-family:var(--serif);font-weight:700;font-size:1.3rem;
    color:var(--maroon-deep);text-decoration:none;
  }
  .logo-badge{
    width:38px;height:38px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, var(--gold-light), var(--gold) 55%, #c98a1f 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 0 rgba(59,35,20,.25);
    font-size:1.1rem;
  }
  .nav-links{display:flex;gap:26px;align-items:center;list-style:none;margin:0;padding:0;}
  .nav-links a{text-decoration:none;font-weight:600;font-size:.95rem;color:var(--choco);opacity:.85;}
  .nav-links a:hover{opacity:1;}
  .nav-cta{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--whatsapp);color:#fff;font-weight:700;
    padding:10px 16px;border-radius:100px;text-decoration:none;font-size:.9rem;
    box-shadow:0 3px 0 #1a9f4f;
  }
  @media (max-width:760px){ .nav-links{display:none;} }

  /* ===== HERO ===== */
  .hero{
    position:relative;
    padding:56px 0 40px;
    background:
      radial-gradient(1100px 500px at 85% -10%, rgba(232,169,59,.35), transparent 60%),
      linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
    overflow:hidden;
  }
  .hero-grid{
    display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;
  }
  @media (max-width:900px){ .hero-grid{grid-template-columns:1fr;} }

  .trust-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    background:#fff;border:1px solid rgba(59,35,20,.1);
    padding:6px 12px;border-radius:100px;font-size:.82rem;font-weight:600;color:var(--choco);
  }
  .pill b{color:var(--maroon-deep);}

  .hero h1{
    font-size:clamp(2.4rem, 5.4vw, 3.9rem);
    line-height:1.04;font-weight:800;letter-spacing:-.01em;
  }
  .hero h1 span{
    font-family:var(--script);color:var(--red);font-weight:700;
    display:inline-block;transform:rotate(-2deg);
  }
  .hero p.lead{
    margin-top:16px;font-size:1.08rem;line-height:1.6;color:var(--choco);max-width:46ch;opacity:.9;
  }

  .hero-ctas{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px;}

  .btn{
    position:relative;
    display:inline-flex;align-items:center;gap:10px;
    padding:15px 26px;border-radius:100px;border:none;
    font-weight:700;font-size:1rem;text-decoration:none;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .btn:active{transform:translateY(2px);}
  .btn-primary{
    background:linear-gradient(180deg, var(--red), #a01f22);
    color:#fff;box-shadow:0 5px 0 var(--maroon-deep), 0 10px 22px rgba(122,31,31,.35);
    overflow:visible;
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--maroon-deep), 0 14px 26px rgba(122,31,31,.4);}
  .btn-ghost{
    background:#fff;color:var(--maroon-deep);border:2px solid rgba(122,31,31,.18);
    box-shadow:0 4px 0 rgba(59,35,20,.08);
  }
  .btn-ghost:hover{border-color:var(--red);transform:translateY(-2px);}

  /* squeeze-bottle signature squiggle under primary CTA */
  .squiggle{
    position:absolute;left:20px;right:20px;bottom:6px;height:8px;pointer-events:none;
  }
  .squiggle path{
    stroke:var(--gold-light);stroke-width:3;fill:none;stroke-linecap:round;
    stroke-dasharray:140;stroke-dashoffset:140;transition:stroke-dashoffset .5s ease;
  }
  .btn-primary:hover .squiggle path{stroke-dashoffset:0;}
  .bottle-icon{transition:transform .35s ease;transform-origin:70% 90%;}
  .btn-primary:hover .bottle-icon{transform:rotate(-24deg) translateY(-2px);}

  /* Hero visual card */
  .hero-visual{position:relative;display:flex;justify-content:center;padding:20px;}
  .tilt-card{
    perspective:1000px;
  }
  .plate{
    width:min(380px, 82vw);aspect-ratio:1/1;border-radius:50%;
    background: radial-gradient(circle at 50% 42%, #fffdf8 0%, #fbeed3 62%, #f0d9ac 100%);
    box-shadow: 0 30px 60px rgba(59,35,20,.28), inset 0 0 0 10px rgba(255,255,255,.6);
    display:flex;align-items:center;justify-content:center;
    transform-style:preserve-3d;
    transition:transform .12s ease-out;
    position:relative;
  }
  .steam{position:absolute;top:-10px;filter:blur(6px);opacity:.55;}
  .steam span{
    position:absolute;bottom:0;width:14px;height:60px;border-radius:50%;
    background:rgba(255,255,255,.9);
    animation:rise 3.2s ease-in-out infinite;
  }
  .steam span:nth-child(1){left:-30px;animation-delay:0s;}
  .steam span:nth-child(2){left:0px;animation-delay:.9s;height:74px;}
  .steam span:nth-child(3){left:30px;animation-delay:1.7s;}
  @keyframes rise{
    0%{transform:translateY(0) scaleX(1);opacity:0;}
    20%{opacity:.6;}
    100%{transform:translateY(-90px) scaleX(1.6);opacity:0;}
  }
  .hero-tag{
    position:absolute;bottom:-6px;left:50%;transform:translateX(-50%) rotate(-3deg);
    background:var(--red);color:#fff;font-family:var(--script);font-size:1.3rem;
    padding:6px 20px;border-radius:100px;box-shadow:0 5px 14px rgba(0,0,0,.25);
    white-space:nowrap;
  }

  /* ===== MENU ===== */
  .menu{padding:70px 0 40px;}
  .section-head{max-width:640px;margin-bottom:34px;}
  .section-head h2{font-size:clamp(1.9rem,4vw,2.7rem);font-weight:700;}
  .section-head p{color:var(--choco);opacity:.85;margin-top:10px;line-height:1.6;}

  .tabs{
    display:flex;gap:10px;flex-wrap:wrap;margin-bottom:32px;
    position:sticky;top:70px;z-index:20;
    background:linear-gradient(180deg, var(--cream) 60%, transparent);
    padding-block:8px;
  }
  .tab{
    padding:10px 18px;border-radius:100px;border:2px solid rgba(122,31,31,.15);
    background:#fff;font-weight:700;font-size:.88rem;color:var(--choco);
    transition:all .18s ease;
  }
  .tab:hover{border-color:var(--red);}
  .tab.active{background:var(--maroon-deep);border-color:var(--maroon-deep);color:#fff;}

  .grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(260px,1fr));gap:22px;
  }

  .card{
    background:#fff;border-radius:var(--radius);padding:20px;
    box-shadow:0 10px 24px rgba(59,35,20,.08);
    transform-style:preserve-3d;transition:transform .12s ease-out, box-shadow .2s ease;
    opacity:0;transform:translateY(18px);
    position:relative;
  }
  .card.in-view{animation:cardIn .55s ease forwards;animation-delay:calc(var(--d,0) * 70ms);}
  @keyframes cardIn{to{opacity:1;transform:translateY(0);}}
  .card:hover{box-shadow:0 18px 34px rgba(59,35,20,.16);}

  .card-icon{
    width:96px;height:96px;margin:0 auto 14px;
    filter:drop-shadow(0 8px 10px rgba(59,35,20,.18));
    transform:translateZ(30px);
  }
  .card h3{font-size:1.18rem;text-align:center;}
  .card p.desc{
    font-size:.86rem;color:var(--choco);opacity:.75;text-align:center;
    margin:6px 0 14px;line-height:1.45;min-height:2.6em;
  }
  .card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .price{font-family:var(--serif);font-weight:700;font-size:1.15rem;color:var(--maroon-deep);}

  .add-btn{
    display:flex;align-items:center;justify-content:center;
    width:40px;height:40px;border-radius:50%;border:none;
    background:var(--gold);color:var(--ink);font-size:1.3rem;font-weight:800;
    box-shadow:0 3px 0 #b3812a;transition:transform .15s ease;
  }
  .add-btn:hover{transform:scale(1.08);}
  .add-btn:active{transform:scale(.94) translateY(2px);}

  .qty-row{display:flex;align-items:center;gap:10px;background:var(--cream-2);border-radius:100px;padding:4px;}
  .qty-row button{
    width:32px;height:32px;border-radius:50%;border:none;background:#fff;font-weight:800;font-size:1.1rem;
    box-shadow:0 2px 0 rgba(59,35,20,.15);
  }
  .qty-row span{min-width:18px;text-align:center;font-weight:700;}

  .flyer{
    position:fixed;z-index:200;pointer-events:none;font-size:1.6rem;
    transition:transform .55s cubic-bezier(.2,.8,.3,1), opacity .55s ease;
  }

  /* ===== STORY STRIP ===== */
  .story{
    padding:60px 0;background:var(--maroon-deep);color:var(--cream);position:relative;overflow:hidden;
  }
  .story::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(600px 300px at 90% 10%, rgba(232,169,59,.25), transparent 60%);
  }
  .story-inner{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;}
  @media (max-width:840px){ .story-inner{grid-template-columns:1fr;} }
  .story h2{color:#fff;font-size:clamp(1.7rem,3.6vw,2.3rem);}
  .story p{opacity:.85;line-height:1.7;margin-top:14px;max-width:52ch;}
  .condiments{display:flex;gap:26px;justify-content:center;}
  .bottle{width:70px;animation:wobble 4s ease-in-out infinite;}
  .bottle:nth-child(2){animation-delay:1.2s;}

  /* ===== LOCATION / FOOTER ===== */
  .location{padding:70px 0;}
  .loc-grid{display:grid;grid-template-columns:1fr 1fr;gap:34px;}
  @media (max-width:840px){ .loc-grid{grid-template-columns:1fr;} }
  .loc-card{
    background:#fff;border-radius:var(--radius);padding:28px;
    box-shadow:0 10px 24px rgba(59,35,20,.08);
  }
  .loc-card h3{font-size:1.3rem;margin-bottom:14px;}
  .loc-line{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;font-size:.95rem;line-height:1.5;}
  .loc-line .ic{flex:none;width:22px;text-align:center;}

  footer{
    padding:34px 0 100px;text-align:center;color:var(--choco);opacity:.65;font-size:.82rem;
  }

  /* ===== FLOATING CART ===== */
  .cart-fab{
    position:fixed;right:20px;bottom:20px;z-index:120;
    display:flex;align-items:center;gap:10px;
    background:var(--maroon-deep);color:#fff;border:none;border-radius:100px;
    padding:14px 20px;box-shadow:0 10px 24px rgba(0,0,0,.3);
    font-weight:700;transition:transform .15s ease;
  }
  .cart-fab:hover{transform:translateY(-3px);}
  .cart-count{
    background:var(--gold);color:var(--ink);border-radius:50%;
    width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:.78rem;
  }
  .wa-fab{
    position:fixed;left:20px;bottom:20px;z-index:120;
    width:56px;height:56px;border-radius:50%;background:var(--whatsapp);
    display:flex;align-items:center;justify-content:center;box-shadow:0 10px 20px rgba(37,211,102,.4);
    font-size:1.6rem;color:#fff;text-decoration:none;
  }

  .overlay{
    position:fixed;inset:0;background:rgba(36,18,8,.5);z-index:150;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .overlay.open{opacity:1;pointer-events:auto;}

  .cart-panel{
    position:fixed;right:0;top:0;bottom:0;width:min(400px,92vw);
    background:var(--cream);z-index:151;box-shadow:-10px 0 30px rgba(0,0,0,.25);
    transform:translateX(100%);transition:transform .3s ease;
    display:flex;flex-direction:column;
  }
  .cart-panel.open{transform:translateX(0);}
  .cart-head{
    padding:22px;display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid rgba(59,35,20,.1);
  }
  .cart-head h3{font-size:1.3rem;}
  .cart-close{background:none;border:none;font-size:1.4rem;color:var(--choco);}
  .cart-items{flex:1;overflow-y:auto;padding:12px 22px;}
  .cart-empty{text-align:center;padding:60px 20px;color:var(--choco);opacity:.6;}
  .cart-item{
    display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px dashed rgba(59,35,20,.12);
  }
  .cart-item .ci-icon{width:48px;height:48px;flex:none;}
  .cart-item .ci-info{flex:1;}
  .cart-item .ci-info h4{font-size:.95rem;margin:0 0 4px;font-family:var(--sans);font-weight:700;}
  .cart-item .ci-info .ci-price{font-size:.82rem;color:var(--choco);opacity:.7;}
  .cart-remove{background:none;border:none;color:var(--red);font-size:.8rem;font-weight:700;text-decoration:underline;}
  .cart-foot{padding:20px 22px;border-top:1px solid rgba(59,35,20,.1);background:#fff;}
  .cart-total{display:flex;justify-content:space-between;font-weight:800;font-size:1.15rem;margin-bottom:14px;}
  .checkout-btn{
    width:100%;justify-content:center;background:var(--whatsapp);color:#fff;
    box-shadow:0 5px 0 #1a9f4f;padding:16px;font-size:1.02rem;border-radius:100px;border:none;
    display:flex;align-items:center;gap:10px;font-weight:800;
  }
  .checkout-btn:disabled{opacity:.45;box-shadow:none;cursor:not-allowed;}
  .cart-hint{font-size:.76rem;text-align:center;margin-top:10px;opacity:.6;}

  @keyframes wobble{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important;transition-duration:.001s !important;}
    .card{opacity:1;transform:none;}
  }

  /* ===== PREMIUM LAYER: grain, cursor, progress, marquee, real photo frame ===== */
  .grain{
    position:fixed;inset:0;z-index:999;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  }
  .progress-bar{
    position:fixed;top:0;left:0;height:3px;
    background:linear-gradient(90deg, var(--red), var(--gold));
    z-index:999;width:0%;transition:width .1s linear;
  }
  .cursor-dot{
    position:fixed;top:0;left:0;width:10px;height:10px;border-radius:50%;
    background:var(--red);pointer-events:none;z-index:998;
    transform:translate(-50%,-50%);transition:width .2s ease,height .2s ease,background .2s ease,opacity .2s ease;
    mix-blend-mode:difference;
  }
  .cursor-ring{
    position:fixed;top:0;left:0;width:38px;height:38px;border-radius:50%;
    border:1.5px solid var(--maroon-deep);pointer-events:none;z-index:998;
    transform:translate(-50%,-50%);transition:width .25s ease,height .25s ease,transform .12s ease-out,opacity .2s ease,border-color .2s ease;
    opacity:.5;
  }
  .cursor-dot.grow, .cursor-ring.grow{width:64px;height:64px;}
  .cursor-ring.grow{border-color:var(--red);opacity:.9;}
  @media (hover:none), (pointer:coarse){
    .cursor-dot,.cursor-ring{display:none;}
  }

  .marquee-strip{
    background:var(--ink);color:var(--gold-light);overflow:hidden;
    padding:14px 0;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);
  }
  .marquee-track{
    display:flex;gap:48px;white-space:nowrap;width:max-content;
    animation:marquee 26s linear infinite;
    font-family:var(--serif);font-size:1.05rem;letter-spacing:.02em;
  }
  .marquee-track span{display:inline-flex;align-items:center;gap:14px;}
  .marquee-track .dot{color:var(--red);font-size:1.4rem;}
  @keyframes marquee{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
  .marquee-strip:hover .marquee-track{animation-play-state:paused;}

  /* real photo hero */
  .photo-frame{
    position:relative;width:min(460px,86vw);transform-style:preserve-3d;transition:transform .15s ease-out;
  }
  .photo-frame .blob-bg{
    position:absolute;inset:-18px -14px -26px -20px;
    background:linear-gradient(155deg, var(--gold-light), var(--gold) 60%, #c9902b);
    clip-path: path('M40,0 C160,-10 300,10 360,60 C420,110 440,220 400,300 C360,380 220,420 120,400 C20,380 -20,300 -10,200 C0,100 -60,10 40,0 Z');
    transform:translateZ(-10px) rotate(-3deg);
    opacity:.9;
  }
  .photo-frame .frame-img{
    position:relative;width:100%;display:block;border-radius:34px 120px 34px 120px / 120px 34px 120px 34px;
    box-shadow:0 30px 60px rgba(59,35,20,.35), 0 0 0 8px rgba(255,255,255,.55);
    transform:translateZ(20px);
    object-fit:cover;aspect-ratio:16/10.6;
  }
  .photo-tag{
    position:absolute;bottom:-14px;left:-14px;background:var(--red);color:#fff;
    font-family:var(--script);font-size:1.35rem;padding:8px 18px;border-radius:100px;
    box-shadow:0 8px 18px rgba(0,0,0,.25);transform:rotate(-4deg) translateZ(40px);
    display:flex;align-items:center;gap:6px;
  }
  .photo-credit{
    position:absolute;top:-12px;right:6px;background:#fff;color:var(--choco);
    font-size:.68rem;font-weight:700;padding:5px 11px;border-radius:100px;
    box-shadow:0 4px 10px rgba(0,0,0,.15);transform:translateZ(45px) rotate(2deg);
    letter-spacing:.03em;text-transform:uppercase;
  }
  .steam2{position:absolute;top:-30px;left:40%;filter:blur(7px);opacity:.5;pointer-events:none;}
  .steam2 span{
    position:absolute;bottom:0;width:12px;height:50px;border-radius:50%;background:#fff;
    animation:rise 3.4s ease-in-out infinite;
  }
  .steam2 span:nth-child(1){left:-24px;animation-delay:.2s;}
  .steam2 span:nth-child(2){left:6px;animation-delay:1.1s;height:64px;}
  .steam2 span:nth-child(3){left:36px;animation-delay:2s;}

  .real-badge{
    display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:800;
    background:rgba(122,31,31,.08);color:var(--maroon-deep);padding:4px 10px;border-radius:100px;
    margin-top:8px;letter-spacing:.02em;
  }
  .card.card-photo{padding:0;overflow:hidden;}
  .card.card-photo .card-photo-img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;}
  .card.card-photo .card-photo-body{padding:18px 20px 20px;}
  .card.card-photo .card-icon{display:none;}

  .magnetic{will-change:transform;}
</style>
</head>
<body>

<svg class="grain" xmlns="http://www.w3.org/2000/svg">
  <filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter>
  <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
</svg>
<div class="progress-bar" id="progressBar"></div>
<div class="cursor-ring" id="cursorRing"></div>
<div class="cursor-dot" id="cursorDot"></div>

<nav class="nav">
  <div class="nav-inner">
    <a class="logo" href="#top">
      <span class="logo-badge">🌼</span> Primavera
    </a>
    <ul class="nav-links">
      <li><a href="#cardapio">Cardápio</a></li>
      <li><a href="#historia">Sobre</a></li>
      <li><a href="#local">Local & horário</a></li>
